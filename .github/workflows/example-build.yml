name: Example - Build on Push

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build binary
        uses: nalchevanidze/hs-pack@v1
        with:
          binary-name: my-app
          ghc-version: '9.4.8'
          cabal-version: '3.10'
          
      - name: Test binary exists
        shell: bash
        run: |
          ls -lh release/
