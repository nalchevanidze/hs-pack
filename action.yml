name: 'Build and Upload Haskell Binaries'
description: 'Build Haskell binaries and upload them to GitHub releases'
branding:
  icon: 'package'
  color: 'purple'

inputs:
  ghc-version:
    description: 'GHC version to use'
    required: false
    default: '9.4.8'
  cabal-version:
    description: 'Cabal version to use'
    required: false
    default: '3.10'
  binary-name:
    description: 'Name of the binary to build (executable name from cabal file)'
    required: true
  package-name:
    description: 'Name of the package (for output binary filename)'
    required: false
    default: ''
  build-dir:
    description: 'Directory where the cabal project is located'
    required: false
    default: '.'
  upload-release:
    description: 'Whether to upload binaries to GitHub release (requires release event)'
    required: false
    default: 'false'
  release-tag:
    description: 'Release tag to upload to (defaults to github.event.release.tag_name)'
    required: false
    default: ''
  extra-build-args:
    description: 'Extra arguments to pass to cabal build'
    required: false
    default: ''
  generate-checksums:
    description: 'Generate SHA256 checksums for binaries'
    required: false
    default: 'true'

outputs:
  binary-path:
    description: 'Path to the built binary'
    value: ${{ steps.package.outputs.binary-path }}
  checksum-path:
    description: 'Path to the checksum file'
    value: ${{ steps.package.outputs.checksum-path }}

runs:
  using: 'composite'
  steps:
    - name: Setup Haskell
      uses: haskell-actions/setup@v2
      with:
        ghc-version: ${{ inputs.ghc-version }}
        cabal-version: ${{ inputs.cabal-version }}
        enable-stack: false

    - name: Cache Cabal dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cabal/packages
          ~/.cabal/store
          ${{ inputs.build-dir }}/dist-newstyle
        key: ${{ runner.os }}-cabal-${{ inputs.ghc-version }}-${{ hashFiles('**/*.cabal', '**/cabal.project') }}
        restore-keys: |
          ${{ runner.os }}-cabal-${{ inputs.ghc-version }}-
          ${{ runner.os }}-cabal-

    - name: Update Cabal package list
      shell: bash
      working-directory: ${{ inputs.build-dir }}
      run: cabal update

    - name: Build binary
      shell: bash
      working-directory: ${{ inputs.build-dir }}
      run: |
        echo "Building Haskell binary: ${{ inputs.binary-name }}"
        cabal build exe:${{ inputs.binary-name }} ${{ inputs.extra-build-args }}

    - name: Package binary
      id: package
      shell: bash
      working-directory: ${{ inputs.build-dir }}
      run: |
        # Determine package name (use input or binary name)
        PACKAGE_NAME="${{ inputs.package-name }}"
        if [ -z "$PACKAGE_NAME" ]; then
          PACKAGE_NAME="${{ inputs.binary-name }}"
        fi
        
        # Get the built binary path
        BINARY_PATH=$(cabal list-bin exe:${{ inputs.binary-name }})
        echo "Found binary at: $BINARY_PATH"
        
        # Determine OS and architecture
        OS_NAME=$(echo "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')
        ARCH=$(uname -m)
        
        # Create release directory
        mkdir -p release
        
        # Copy and rename binary
        if [ "$RUNNER_OS" = "Windows" ]; then
          OUTPUT_NAME="${PACKAGE_NAME}-${OS_NAME}-${ARCH}.exe"
        else
          OUTPUT_NAME="${PACKAGE_NAME}-${OS_NAME}-${ARCH}"
        fi
        
        cp "$BINARY_PATH" "release/$OUTPUT_NAME"
        chmod +x "release/$OUTPUT_NAME"
        
        echo "Packaged binary as: release/$OUTPUT_NAME"
        echo "binary-path=$(pwd)/release/$OUTPUT_NAME" >> $GITHUB_OUTPUT
        
        # Generate checksums if requested
        if [ "${{ inputs.generate-checksums }}" = "true" ]; then
          cd release
          if command -v sha256sum &> /dev/null; then
            sha256sum "$OUTPUT_NAME" > "${OUTPUT_NAME}.sha256"
          elif command -v shasum &> /dev/null; then
            shasum -a 256 "$OUTPUT_NAME" > "${OUTPUT_NAME}.sha256"
          fi
          echo "checksum-path=$(pwd)/${OUTPUT_NAME}.sha256" >> $GITHUB_OUTPUT
          cd ..
        fi
        
        # List release contents
        echo "Release artifacts:"
        ls -lh release/

    - name: Upload to GitHub Release
      if: inputs.upload-release == 'true'
      shell: bash
      working-directory: ${{ inputs.build-dir }}
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        # Determine release tag
        RELEASE_TAG="${{ inputs.release-tag }}"
        if [ -z "$RELEASE_TAG" ]; then
          RELEASE_TAG="${{ github.event.release.tag_name }}"
        fi
        
        if [ -z "$RELEASE_TAG" ]; then
          echo "Error: No release tag specified and not running in release context"
          exit 1
        fi
        
        echo "Uploading artifacts to release: $RELEASE_TAG"
        gh release upload "$RELEASE_TAG" release/* --clobber

    - name: Upload artifacts to workflow
      if: inputs.upload-release != 'true'
      uses: actions/upload-artifact@v3
      with:
        name: ${{ inputs.binary-name }}-${{ runner.os }}-${{ runner.arch }}
        path: ${{ inputs.build-dir }}/release/*
